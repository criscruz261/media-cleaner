[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-cleaner-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "platformdirs>=4,<5",
  "Pillow>=11,<13", "pillow-heif>=0.21,<2", "send2trash>=1.8,<3", "ImageHash>=4.3,<5", "rawpy>=0.25,<1", "static-ffmpeg==3.0", "mediapipe==0.10.32", "opencv-contrib-python==4.11.0.86"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "tifffile>=2025,<2027"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "migrations"
